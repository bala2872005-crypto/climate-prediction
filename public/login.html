<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — ClimateSense AI</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111b;color:#eef8ff;font-family:system-ui}.box{width:min(410px,90vw);padding:32px;border:1px solid #1e3445;border-radius:22px;background:#0d1b28}.orb{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#42e6a4,#38c9e8);display:inline-block;vertical-align:middle;margin-right:9px}h1{font-size:32px}p{color:#8fa8b8;line-height:1.6}input,button{width:100%;padding:14px;border-radius:11px;box-sizing:border-box}input{background:#07131e;color:white;border:1px solid #284152;margin:10px 0}button{border:0;background:linear-gradient(90deg,#27c98c,#24b7d8);font-weight:800;cursor:pointer}.err{color:#ff9b9b;margin-top:10px;font-size:13px}</style></head><body><main class="box"><div><span class="orb"></span><b>ClimateSense AI</b></div><h1>Welcome back</h1><p>Sign in with your email to access your climate dashboard and saved analyses.</p><form id="f"><input id="email" type="email" placeholder="you@example.com" autocomplete="username webauthn" required><input id="code" inputmode="numeric" placeholder="6-digit code" style="display:none"><button id="go">Continue</button></form><div class="err" id="err"></div></main><script>let sent=false,mail='';f.onsubmit=async e=>{e.preventDefault();err.textContent='';try{if(!sent){mail=email.value;await hatchable.auth.startLogin({email:mail});sent=true;email.style.display='none';code.style.display='block';go.textContent='Sign in'}else{await hatchable.auth.verifyCode({email:mail,code:code.value});location.href=new URLSearchParams(location.search).get('next')||'/'}}catch(x){err.textContent=x.message||'Unable to sign in'}}</script></body></html>
